name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Les runners windows-latest embarquent Visual Studio + la charge "Desktop
      # development with C++". Mais le node-gyp fourni avec Node 20 (10.1.0) ne sait
      # pas détecter les versions récentes de VS (« 18 ») → crash
      # ERR_CHILD_PROCESS_STDIO_MAXBUFFER. On force un node-gyp à jour, qui les gère.
      - name: Mettre à jour node-gyp (support des versions récentes de Visual Studio)
        shell: bash
        run: |
          npm install -g node-gyp@latest
          npm config set node_gyp "$(npm root -g)/node-gyp/bin/node-gyp.js"

      - name: Install dependencies
        run: npm install

      # Sur une branche : build seul (pas de publication).
      - name: Build (.exe, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run package

      # Sur un tag vX.Y.Z : build + publication GitHub (installeur + latest.yml +
      # blockmap), ce que electron-updater consomme pour les mises à jour auto.
      - name: Release (.exe + latest.yml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Non bloquant : si le quota d'artefacts Actions est atteint, on s'appuie
      # sur la Release.
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dofus-multi-account-windows
          path: dist/*.exe
          if-no-files-found: error
