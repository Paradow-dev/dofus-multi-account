name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publier une release GitHub (installeur + latest.yml) à partir de la version de package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Épinglé sur windows-2022 (Visual Studio 2022) : « windows-latest » pointe
    # désormais sur Windows 2025 + Visual Studio 2026, que le node-gyp livré avec
    # Node 20 ne sait pas détecter (échec de compilation de node-window-manager).
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # windows-2022 embarque Visual Studio 2022 + la charge "Desktop development
      # with C++" : node-gyp compile node-window-manager sans étape supplémentaire.
      - name: Install dependencies
        run: npm install

      # Décide s'il faut publier une release. Vrai si :
      #  - push d'un tag vX.Y.Z, ou
      #  - dispatch manuel avec l'option « release », ou
      #  - push sur main dont la version package.json n'a pas encore de tag.
      # => bumper la version dans package.json puis merger sur main suffit à publier ;
      #    les pushes suivants à version inchangée ne re-publient pas.
      - name: Déterminer s'il faut publier
        id: decide
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.release }}" == "true" ]]; then
            RELEASE=true
          elif git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            RELEASE=false  # un tag/release existe déjà pour cette version
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION release=$RELEASE"

      # Build seul (pas de publication).
      - name: Build (.exe, no publish)
        if: ${{ steps.decide.outputs.release != 'true' }}
        run: npm run package

      # Publication GitHub (installeur + latest.yml + blockmap, consommés par
      # electron-updater). electron-builder crée la Release et le tag vX.Y.Z
      # d'après la version de package.json.
      - name: Release (.exe + latest.yml)
        if: ${{ steps.decide.outputs.release == 'true' }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Non bloquant : si le quota d'artefacts Actions est atteint, on s'appuie
      # sur la Release.
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dofus-multi-account-windows
          path: dist/*.exe
          if-no-files-found: error
