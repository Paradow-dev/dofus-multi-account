name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publier une release GitHub (installeur + latest.yml) à partir de la version de package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Épinglé sur windows-2022 (Visual Studio 2022) : « windows-latest » pointe
    # désormais sur Windows 2025 + Visual Studio 2026, que le node-gyp livré avec
    # Node 20 ne sait pas détecter (échec de compilation de node-window-manager).
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # windows-2022 embarque Visual Studio 2022 + la charge "Desktop development
      # with C++" : node-gyp compile node-window-manager sans étape supplémentaire.
      - name: Install dependencies
        run: npm install

      # Build seul (pas de publication) : push de branche, ou dispatch sans release.
      - name: Build (.exe, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.release != 'true' }}
        run: npm run package

      # Publication GitHub (installeur + latest.yml + blockmap, consommés par
      # electron-updater) : sur un tag vX.Y.Z, ou via un dispatch manuel avec
      # l'option « release » cochée. Dans ce dernier cas, electron-builder crée
      # lui-même la Release et le tag vX.Y.Z d'après la version de package.json.
      - name: Release (.exe + latest.yml)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true' }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Non bloquant : si le quota d'artefacts Actions est atteint, on s'appuie
      # sur la Release.
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dofus-multi-account-windows
          path: dist/*.exe
          if-no-files-found: error
