name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Épinglé sur windows-2022 (Visual Studio 2022) : « windows-latest » pointe
    # désormais sur Windows 2025 + Visual Studio 2026, que le node-gyp livré avec
    # Node 20 ne sait pas détecter (échec de compilation de node-window-manager).
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # windows-2022 embarque Visual Studio 2022 + la charge "Desktop development
      # with C++" : node-gyp compile node-window-manager sans étape supplémentaire.
      - name: Install dependencies
        run: npm install

      # Sur une branche : build seul (pas de publication).
      - name: Build (.exe, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run package

      # Sur un tag vX.Y.Z : build + publication GitHub (installeur + latest.yml +
      # blockmap), ce que electron-updater consomme pour les mises à jour auto.
      - name: Release (.exe + latest.yml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Non bloquant : si le quota d'artefacts Actions est atteint, on s'appuie
      # sur la Release.
      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dofus-multi-account-windows
          path: dist/*.exe
          if-no-files-found: error
