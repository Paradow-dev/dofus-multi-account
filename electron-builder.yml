appId: be.paradow.dofus-multi-account
productName: Dofus Multi-Account
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Fournisseur de mise à jour : Releases GitHub (repo public).
# electron-builder génère app-update.yml dans l'app + latest.yml dans la Release,
# tous deux nécessaires à electron-updater.
publish:
  provider: github
  owner: Paradow-dev
  repo: dofus-multi-account
  releaseType: release
