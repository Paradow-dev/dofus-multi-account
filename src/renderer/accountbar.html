<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;"
    />
    <title>Barre de comptes</title>
  </head>
  <body class="ab-body">
    <div id="bar" class="ab-bar" title="Glisser pour déplacer">
      <span class="ab-grip" aria-hidden="true"></span>
      <div id="chips" class="ab-chips"></div>
      <button id="combat-btn" class="ab-combat" title="Activer le mode combat" aria-label="Mode combat">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Épée 1 : pointe NW → pommeau SE -->
          <!-- Lame effilée (polygone) -->
          <polygon points="4,4 15.1,12.9 12.9,15.1" fill="currentColor"/>
          <!-- Garde perpendiculaire -->
          <line x1="11" y1="16.5" x2="16.5" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <!-- Poignée -->
          <line x1="14" y1="14" x2="18.5" y2="18.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Pommeau -->
          <circle cx="20" cy="20" r="2" fill="currentColor"/>
          <!-- Épée 2 : pointe NE → pommeau SW (par-dessus à l'intersection) -->
          <!-- Lame effilée -->
          <polygon points="20,4 11.1,15.1 8.9,12.9" fill="currentColor"/>
          <!-- Garde perpendiculaire -->
          <line x1="7.5" y1="11" x2="13" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <!-- Poignée -->
          <line x1="10" y1="14" x2="5.5" y2="18.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <!-- Pommeau -->
          <circle cx="4" cy="20" r="2" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <script type="module" src="./accountbar.ts"></script>
  </body>
</html>
