<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;"
    />
    <title>Barre de comptes</title>
  </head>
  <body class="ab-body">
    <div id="bar" class="ab-bar" title="Glisser pour déplacer">
      <span class="ab-grip" aria-hidden="true"></span>
      <div id="chips" class="ab-chips"></div>
      <button id="combat-btn" class="ab-combat" title="Activer le mode combat" aria-label="Mode combat">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- lame 1 : haut-gauche → bas-droite -->
          <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="7" y1="5.5" x2="9.5" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="4.8" cy="4.8" r="1.6" fill="currentColor"/>
          <!-- lame 2 : haut-droite → bas-gauche -->
          <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="17" y1="5.5" x2="14.5" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="19.2" cy="4.8" r="1.6" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <script type="module" src="./accountbar.ts"></script>
  </body>
</html>
