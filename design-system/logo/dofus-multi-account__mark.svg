<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo « jetons de comptes » : trois pastilles d'avatar superposées,
       la plus en avant en rouge = compte actif. Illustre le multi-compte.
       Géométrie alignée sur scripts/gen-icons.mjs (espace 512×512). -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0E1116"></rect>

  <!-- Jeton arrière (gris sombre) -->
  <g>
    <circle cx="190" cy="262" r="96" fill="#181C23"></circle>
    <circle cx="190" cy="262" r="90" fill="none" stroke="#5C6068" stroke-width="12"></circle>
    <g fill="#5C6068">
      <circle cx="190" cy="242.8" r="24.96"></circle>
      <path d="M 145.84 310 A 44.16 44.16 0 0 1 234.16 310 Z"></path>
    </g>
  </g>

  <!-- Jeton intermédiaire (gris clair) -->
  <g>
    <circle cx="256" cy="262" r="96" fill="#1D222B"></circle>
    <circle cx="256" cy="262" r="90" fill="none" stroke="#9A9EA6" stroke-width="12"></circle>
    <g fill="#9A9EA6">
      <circle cx="256" cy="242.8" r="24.96"></circle>
      <path d="M 211.84 310 A 44.16 44.16 0 0 1 300.16 310 Z"></path>
    </g>
  </g>

  <!-- Jeton actif (rouge) -->
  <g>
    <circle cx="322" cy="262" r="96" fill="#242B37"></circle>
    <circle cx="322" cy="262" r="90" fill="none" stroke="#FF5C57" stroke-width="12"></circle>
    <g fill="#FF5C57">
      <circle cx="322" cy="242.8" r="24.96"></circle>
      <path d="M 277.84 310 A 44.16 44.16 0 0 1 366.16 310 Z"></path>
    </g>
  </g>
</svg>
