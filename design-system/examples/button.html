<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Paradow · Buttons example</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  body { padding: 40px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 36px; padding: 0 16px;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer;
    transition: background var(--dur-instant) var(--ease-standard);
  }
  .btn--primary   { background: var(--accent); color: var(--accent-on); }
  .btn--primary:hover   { background: var(--accent-hover); }
  .btn--secondary { background: var(--bg-elevated); color: var(--ink); border-color: var(--line-strong); }
  .btn--secondary:hover { background: var(--bg-subtle); }
  .btn--ghost     { background: transparent; color: var(--ink-2); }
  .btn--ghost:hover     { background: var(--bg-subtle); color: var(--ink); }
  .btn--danger    { background: var(--danger); color: #fff; }
</style>
</head>
<body>
  <button class="btn btn--primary">Primary action</button>
  <button class="btn btn--secondary">Secondary</button>
  <button class="btn btn--ghost">Ghost</button>
  <button class="btn btn--danger">Danger</button>
</body>
</html>
